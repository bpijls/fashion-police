# Fashion Police — kiosk edge (frontend + backend), for the reverse-proxy host.
#
# The frontend container serves the SPA and proxies /api/* to the backend, so
# the kiosk sees one origin. The outer Caddy Docker Proxy routes APP_DOMAIN here.
# The backend is not exposed to the outer proxy directly.
#
#   docker compose --env-file .env -f deploy/edge.compose.yml up -d --build
#
# Needs the YuNet model on the host: scripts/download-models.sh

name: fashion-police

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: fashion-police-backend:latest
    restart: unless-stopped
    environment:
      COMPUTE_URL: ${COMPUTE_URL:?set COMPUTE_URL in .env}
      COMPUTE_SECRET: ${COMPUTE_SECRET:?set COMPUTE_SECRET in .env}
      KIOSK_TOKEN: ${KIOSK_TOKEN:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-14}
      FP_BACKEND_FACE_CHECK: ${FP_BACKEND_FACE_CHECK:-required}
    volumes:
      - ../models/face_detection_yunet_2023mar.onnx:/models/face_detection_yunet_2023mar.onnx:ro
      - fp_backend_data:/srv/data
    expose:
      - "8800"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_MODEL_BASE: ${VITE_MODEL_BASE:-}
    image: fashion-police-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_UPSTREAM: backend:8800
    networks:
      - default
      - caddy
    labels:
      caddy: ${APP_DOMAIN:?set APP_DOMAIN in .env}
      caddy.reverse_proxy: "{{upstreams 80}}"
      caddy_docker_network: ${CADDY_NETWORK:?set CADDY_NETWORK in .env}

networks:
  caddy:
    external: true
    name: ${CADDY_NETWORK}
  default: {}

volumes:
  fp_backend_data:
